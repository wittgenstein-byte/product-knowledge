version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: si-product-hub-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: si_product_hub
      MYSQL_USER: si_user
      MYSQL_PASSWORD: si_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - si_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: si-product-hub-backend
    restart: always
    ports:
      - "4001:4001"
    depends_on:
      - mysql
    env_file:
      - ./backend/.env
    environment:
      - PORT=4001
      - DB_HOST=mysql
      - DB_USER=si_user
      - DB_PASSWORD=si_password
      - DB_NAME=si_product_hub
    networks:
      - si_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: si-product-hub-gateway
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      - backend
    environment:
      - PORT=4000
      - BACKEND_URL=http://backend:4001
    networks:
      - si_network

volumes:
  mysql_data:

networks:
  si_network:
    driver: bridge
